name: Ferry check

on:
  schedule:
    # Every 6 hours, matching the forecast models' refresh cycle:
    # 23,05,11,17 UTC = 06:00, 12:00, 18:00, 00:00 ICT (UTC+7)
    - cron: "0 23,5,11,17 * * *"
  workflow_dispatch:   # "Run workflow" button in the Actions tab
    inputs:
      test_event:
        description: "Add a synthetic event to test the Mac notification"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit state.json back to the repo

# Never let two runs push state.json at the same time.
concurrency: ferry-check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r backend/requirements.txt

      - name: Score departures and write state.json
        run: python backend/main.py ${{ inputs.test_event && '--test-event' || '' }}

      - name: Commit state.json
        run: |
          git config user.name "ferry-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Update ferry state"
          git pull --rebase
          git push
